global:
  scrape_interval: 5s

scrape_configs:
  - job_name: microservicos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # gateway
          - host.docker.internal:8081   # pecas-service
          - host.docker.internal:8082   # clientes-service
          - host.docker.internal:8083   # representantes-service
